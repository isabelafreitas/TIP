name: Deploy TIP Sim to GitHub Pages

on:
  push:
    branches:
      - claude/mobile-app-browser-sim-4dm99n
    paths:
      - 'tip-sim/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tip-sim/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tip-sim

      - name: Build
        run: npm run build
        working-directory: tip-sim

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tip-sim/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
